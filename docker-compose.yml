version: "3.9"

services:
  backend:
    build: ./backend
    container_name: pawtrainer-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./pawtrainer.db
      - SECRET_KEY=cambia-esta-clave-en-produccion
      - DEBUG=true
      - ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:8080"]
    volumes:
      - ./backend:/app
      - pawtrainer_data:/app/data
    restart: unless-stopped

volumes:
  pawtrainer_data:
