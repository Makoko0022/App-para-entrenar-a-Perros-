services:
  - type: web
    name: pawtrainer-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./pawtrainer.db
      - key: DEBUG
        value: false
      - key: ALLOWED_ORIGINS
        value: '["*"]'
    healthCheckPath: /health
